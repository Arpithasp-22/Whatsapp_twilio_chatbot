TOP_DEALERS:
  exact:
    - "top dealers"
    - "best dealers"
  keywords:
    - "top"
    - "best"
  regex:
    - "top\\s+\\d+\\s+dealers"
    - "best\\s+dealers"

STATE:
  exact:
    - "sales by state"
    - "state wise sales"
  keywords:
    - "state"
    - "state wise"
    - "by state"
  regex:
    - "sales\\s+by\\s+state"
    - "state\\s+wise"

DEALER:
  exact: []
  keywords:
    - "dealer"
    - "sales for dealer"
  regex:
    - "dealer\\s+.+"
    - "sales\\s+for\\s+dealer\\s+.+"

PRODUCT:
  exact: []
  keywords:
    - "product"
    - "sales for"
    - "dealers for"
  regex:
    - "sales\\s+for\\s+.+"
    - "dealers\\s+for\\s+.+"
YEARLY_SALES:
  keywords: ["yearly", "by year", "year wise"]
  regex: ["sales.*year"]

MONTHLY_SALES:
  keywords: ["monthly", "by month", "month wise"]
  regex: ["sales.*month"]
